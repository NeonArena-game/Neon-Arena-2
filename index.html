    <script>
        // v5.26 — Modo de Economia de Energia por subpágina.
        // 5 minutos sem interação no Neon Arena 2 -> ?economy-mode=true.
        // A subpágina não carrega Phaser, Services ou game.js.
        (function(){
            const ECONOMY_QUERY = '?economy-mode=true';
            const TIMEOUT_MS = 5 * 60 * 1000;
            const params = new URLSearchParams(location.search);
            const isEconomyPage = params.get('economy-mode') === 'true';
            const mainUrl = () => location.pathname + (location.hash || '');

            if (isEconomyPage) {
                window.NA_ECONOMY_MODE = true;
                const applyEconomyPage = () => {
                    document.title = 'Neon Arena 2 — Economia de energia';
                    document.documentElement.style.cssText = 'margin:0!important;padding:0!important;width:100%!important;height:100%!important;background:#000!important;overflow:hidden!important;';
                    document.body.style.cssText = 'margin:0!important;padding:0!important;width:100%!important;height:100%!important;background:#000!important;overflow:hidden!important;cursor:default!important;';
                    document.body.innerHTML = '';
                };
                const wake = () => location.replace(mainUrl());
                if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyEconomyPage, {once:true});
                else applyEconomyPage();
                ['pointerdown','touchstart','keydown'].forEach(type => window.addEventListener(type, wake, {passive:true, once:true}));
                return;
            }

            let lastActivity = Date.now();
            let economyTimer = null;
            const registerActivity = () => { lastActivity = Date.now(); };
            ['pointerdown','mousedown','touchstart','keydown','wheel'].forEach(type => {
                window.addEventListener(type, registerActivity, {passive:true});
            });
            const enterEconomyMode = () => {
                const url = new URL(location.href);
                url.search = ECONOMY_QUERY;
                url.hash = '';
                location.replace(url.href);
            };
            economyTimer = window.setInterval(() => {
                if (Date.now() - lastActivity >= TIMEOUT_MS) enterEconomyMode();
            }, 1000);
            window.addEventListener('pagehide', () => {
                if (economyTimer) clearInterval(economyTimer);
            }, {once:true});
        })();
    </script>
    <script>
        // v5.24 — Página secreta de Backup/Transferência de Dados.
        // O navegador não pode gravar diretamente em data/, então o fluxo é:
        // Exportar -> baixar JSON -> colocar em data/neon-arena-2-save.json.
        // Importar aceita arquivo local ou tenta carregar esse arquivo da pasta data/.
        (function(){
            if (location.search !== '?save-data') return;
            window.NA_SAVE_DATA_PAGE = true;
            document.documentElement.classList.add('na-requirements-page');
            document.addEventListener('DOMContentLoaded', function(){
                document.body.innerHTML = `
                    <main class="na-req-wrap na-save-wrap">
                        <h1 class="na-req-title">💾 Neon Arena 2 — Dados Portáteis</h1>
                        <p class="na-req-sub">Exporte seu progresso para um arquivo JSON e leve seus dados para outro navegador ou outro PC. O arquivo contém os dados salvos no navegador, incluindo progresso, conquistas, configurações e desbloqueios.</p>
                        <section class="na-save-card">
                            <h2>📤 EXPORTAR DADOS</h2>
                            <p>Cria um arquivo <b>neon-arena-2-save.json</b> com os dados atuais.</p>
                            <button id="na-save-export">📥 BAIXAR JSON</button>
                        </section>
                        <section class="na-save-card">
                            <h2>📥 IMPORTAR DADOS</h2>
                            <p>Você pode selecionar qualquer backup JSON válido ou colocar o arquivo como <b>data/neon-arena-2-save.json</b> e usar o botão abaixo.</p>
                            <button id="na-save-file">📂 SELECIONAR JSON</button>
                            <button id="na-save-folder">📁 CARREGAR DE data/</button>
                            <input id="na-save-input" type="file" accept="application/json,.json" style="display:none">
                        </section>
                        <section class="na-save-card na-save-warning">
                            <h2>⚠️ IMPORTANTE</h2>
                            <p>Importar substitui os dados atuais do navegador pelos dados do arquivo. Faça um backup antes de importar se quiser preservar o progresso atual.</p>
                        </section>
                        <div id="na-save-status" class="na-save-status">Status: pronto.</div>
                        <a class="na-req-back" href="./">← Voltar para o Neon Arena 2</a>
                    </main>`;

                const status = document.getElementById('na-save-status');
                const input = document.getElementById('na-save-input');
                const STORAGE_VERSION = 1;

                function collectSave(){
                    const localStorageData = {};
                    for (let i=0; i<localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key != null) localStorageData[key] = localStorage.getItem(key);
                    }
                    return {
                        format: 'NeonArena2Save',
                        version: STORAGE_VERSION,
                        exportedAt: new Date().toISOString(),
                        game: 'Neon Arena 2',
                        localStorage: localStorageData
                    };
                }

                function downloadSave(){
                    const blob = new Blob([JSON.stringify(collectSave(), null, 2)], {type:'application/json'});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'neon-arena-2-save.json';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    status.textContent = '✅ Backup criado: neon-arena-2-save.json';
                }

                function applySave(data){
                    if (!data || data.format !== 'NeonArena2Save' || !data.localStorage || typeof data.localStorage !== 'object' || Array.isArray(data.localStorage)) {
                        throw new Error('Formato de backup inválido.');
                    }
                    const entries = Object.entries(data.localStorage);
                    entries.forEach(([key,value]) => {
                        if (typeof key !== 'string' || typeof value !== 'string') return;
                        localStorage.setItem(key, value);
                    });
                    status.textContent = `✅ ${entries.length} dados importados. Reiniciando o Neon Arena 2...`;
                    setTimeout(() => location.href = './', 700);
                }

                async function loadDataFolder(){
                    status.textContent = '⏳ Procurando data/neon-arena-2-save.json...';
                    try {
                        const response = await fetch('data/neon-arena-2-save.json', {cache:'no-store'});
                        if (!response.ok) throw new Error('Arquivo não encontrado.');
                        applySave(await response.json());
                    } catch (error) {
                        status.textContent = '❌ Não foi possível carregar data/neon-arena-2-save.json. Coloque o backup nessa pasta e tente novamente.';
                    }
                }

                document.getElementById('na-save-export').onclick = downloadSave;
                document.getElementById('na-save-file').onclick = () => input.click();
                document.getElementById('na-save-folder').onclick = loadDataFolder;
                input.onchange = () => {
                    const file = input.files && input.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = () => {
                        try { applySave(JSON.parse(reader.result)); }
                        catch (error) { status.textContent = '❌ Backup inválido ou corrompido.'; }
                    };
                    reader.readAsText(file);
                };
            }, {once:true});
        })();
    </script>

    <script>

            window.NA_REQUIREMENTS_PAGE = true;
            document.documentElement.classList.add('na-requirements-page');

                    'pt-PT': {title:'✨ Neon Arena 2 — Better Details',sub:'Requisitos estimados para os níveis de Detalhes Melhorados. O modo OFF mantém o visual básico para dar prioridade ao desempenho.',min:'🟢 MÍNIMOS',ideal:'🟡 IDEAIS',rec:'🟣 RECOMENDADOS',max:'💜 MÁXIMOS',off:'🚫 OFF',back:'← Voltar para o Neon Arena 2',note:'💡 Importante',noteBody:'Estes são requisitos de referência do Better Details, não requisitos rígidos de todo o Neon Arena 2. O nível ULTRA é opcional e pode reduzir o FPS em computadores mais antigos.',cpu:'CPU',ram:'RAM',gpu:'GPU',storage:'Espaço livre',webgl:'WebGL 2',browser:'Navegador',accel:'Aceleração gráfica',res:'Resolução alvo',level:'Nível gráfico'},
                    'en': {title:'✨ Neon Arena 2 — Better Details',sub:'Estimated requirements for the Better Details quality levels. OFF keeps the basic visual package to prioritize performance.',min:'🟢 MINIMUM',ideal:'🟡 IDEAL',rec:'🟣 RECOMMENDED',max:'💜 MAXIMUM',off:'🚫 OFF',back:'← Back to Neon Arena 2',note:'💡 Important',noteBody:'These are reference requirements for Better Details, not strict requirements for the entire Neon Arena 2. ULTRA is optional and may reduce FPS on older computers.',cpu:'CPU',ram:'RAM',gpu:'GPU',storage:'Free storage',webgl:'WebGL 2',browser:'Browser',accel:'Hardware acceleration',res:'Target resolution',level:'Graphics level'},

    <script>
        // v5.21 — Página de Debug Mode. A senha é uma trava local de acesso,
        // não um mecanismo de segurança criptográfica (o código é client-side).
        (function(){
            const params = new URLSearchParams(location.search);
            if (params.get('debug-mode') !== 'true') return;

            const DEBUG_PASSWORD = 'NA2-DEBUG-2026';
            window.__NA2_DEBUG_AUTHENTICATED__ = false;

            function showDebugAuth(){
                const overlay = document.createElement('div');
                overlay.id = 'na2-debug-auth';
                overlay.style.cssText = 'position:fixed;inset:0;z-index:100000;background:radial-gradient(circle at 50% 35%,#10232b 0,#05070b 55%,#020304 100%);display:flex;align-items:center;justify-content:center;color:#fff;font:15px Consolas,Monaco,monospace;';
                overlay.innerHTML = `
                    <form id="na2-debug-auth-form" style="width:min(420px,calc(100vw - 36px));box-sizing:border-box;background:#080d13;border:2px solid #00ffff;border-radius:14px;padding:26px;box-shadow:0 0 35px rgba(0,255,255,.25);text-align:center">
                        <div style="font-size:34px;margin-bottom:8px">🛠️</div>
                        <h1 style="margin:0 0 8px;color:#00ffff;font-size:24px">NEON ARENA 2 DEBUG</h1>
                        <p style="color:#a9bdc6;line-height:1.5;margin:0 0 20px">Esta página ativa ferramentas internas de teste. Digite a senha para continuar.</p>
                        <input id="na2-debug-password" type="password" autocomplete="off" placeholder="Senha do Debug Mode" style="width:100%;box-sizing:border-box;background:#101923;color:#fff;border:1px solid #2c5963;border-radius:7px;padding:12px;font:15px Consolas,monospace;outline:none">
                        <button type="submit" style="width:100%;margin-top:12px;background:#00a8a8;color:#001416;border:0;border-radius:7px;padding:12px;font:bold 15px Consolas,monospace;cursor:pointer">🔓 ENTRAR NO DEBUG</button>
                        <div id="na2-debug-auth-error" style="min-height:20px;margin-top:12px;color:#ff6677"></div>
                        <div style="font-size:11px;color:#617783;margin-top:8px">Aperte H dentro do jogo para abrir o painel.</div>
                    </form>`;
                document.body.appendChild(overlay);
                const form = overlay.querySelector('#na2-debug-auth-form');
                const input = overlay.querySelector('#na2-debug-password');
                const error = overlay.querySelector('#na2-debug-auth-error');
                input.focus();
                form.addEventListener('submit', function(event){
                    event.preventDefault();
                    if (input.value === DEBUG_PASSWORD) {
                        window.__NA2_DEBUG_AUTHENTICATED__ = true;
                        overlay.remove();
                        if (window.NA2_DEBUG) window.NA2_DEBUG.authenticated = true;
                    } else {
                        error.textContent = '❌ Senha incorreta.';
                        input.value = '';
                        input.focus();
                    }
                });
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showDebugAuth, {once:true});
            else showDebugAuth();
        })();
    </script>

</head>
<body>

    <!-- Input oculto para carregar a skin personalizada 8x8 do computador -->
    <input type="file" id="skin-file-input" accept="image/png, image/jpeg" style="display: none;">

    <script>
        const skinFileInput = document.getElementById('skin-file-input');
        if (skinFileInput) skinFileInput.addEventListener('change', (event) => {
            let file = event.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = (e) => {
                    let base64Image = e.target.result;
                    localStorage.setItem('neon_custom_skin_data', base64Image);
                    alert('Skin 8x8 carregada com sucesso! Recarregue a partida para aplicar.');
                    location.reload();
                };
                reader.readAsDataURL(file);
            }
        });
    </script>

    <!-- v5.26 — Runtime do NA2. No modo de economia, nada é carregado. -->
    <script>
        if (!window.NA_ECONOMY_MODE) {
            const naRuntimeScripts = [
                'https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js',
                'NA2-Services.js',
                'game.js'
            ];
            let naRuntimeIndex = 0;
            const loadNextNA2Script = () => {
                if (naRuntimeIndex >= naRuntimeScripts.length) return;
                const script = document.createElement('script');
                script.src = naRuntimeScripts[naRuntimeIndex++];
                script.onload = loadNextNA2Script;
                document.body.appendChild(script);
            };
            loadNextNA2Script();
        }
    </script>
    <!-- Drop Updates oficiais já estão incorporadas diretamente em game.js. -->
